name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/catetin_test
      TEST_SMTP_HOST: 127.0.0.1
      TEST_SMTP_PORT: "1025"
    services:
      db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: catetin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d catetin_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mail:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Prepare test database
        run: bun run test:db
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:int
      - run: bun run build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/catetin_test
          APP_URL: https://ci.invalid
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0000000000000000
          CRON_SECRET: ci-only
          SIGNING_SECRET: ci-only
          REALTIME_DRIVER: none
          STORAGE_DRIVER: local
