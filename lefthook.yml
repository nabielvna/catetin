pre-commit:
  parallel: false
  commands:
    lint:
      priority: 1
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: bunx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    format:
      priority: 2
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,css,scss,less,md,mdx,yml,yaml,html}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
pre-push:
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
