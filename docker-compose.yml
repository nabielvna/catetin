services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catetin
      POSTGRES_PASSWORD: catetin
      POSTGRES_DB: catetin
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - db18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catetin -d catetin"]
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  db18-data:
